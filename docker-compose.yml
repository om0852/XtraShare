version: '3.8'

services:
  xtrashare:
    build:
      context: .
      dockerfile: Dockerfile
    image: xtrashare:latest
    container_name: xtrashare-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SSL_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
